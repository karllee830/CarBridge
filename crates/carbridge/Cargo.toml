[package]
name = "carbridge"
description = "CarBridge for OpenWrt: iPhone CarPlay to Carlink head units."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
carbridge-carlink-ble.workspace = true
carbridge-carlink-proto.workspace = true
carbridge-carlink-session.workspace = true
carbridge-carlink-wfd.workspace = true
carbridge-carlink-wifi.workspace = true
carbridge-carplay.workspace = true
carbridge-platform.workspace = true
futures-util.workspace = true
libc.workspace = true
rand_core.workspace = true
serde.workspace = true
serde_json.workspace = true
zbus.workspace = true
tokio = { workspace = true, features = ["rt", "macros", "signal", "time", "net", "fs", "sync", "io-util"] }

[dev-dependencies]
base64ct.workspace = true
prost.workspace = true
tokio = { workspace = true, features = ["rt", "macros", "time", "fs", "test-util"] }
