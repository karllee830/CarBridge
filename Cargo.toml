[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "AGPL-3.0-only"
rust-version = "1.85"

[workspace.dependencies]
# This workspace
carbridge-carlink-proto = { path = "crates/carlink-proto" }
carbridge-carlink-ble = { path = "crates/carlink-ble" }
carbridge-carlink-wifi = { path = "crates/carlink-wifi" }
carbridge-carlink-session = { path = "crates/carlink-session" }
carbridge-carlink-wfd = { path = "crates/carlink-wfd" }
carbridge-carplay = { path = "crates/carplay" }
carbridge-platform = { path = "crates/platform-openwrt" }
carbridge-airplay = { path = "crates/airplay" }
carbridge-iap2 = { path = "crates/iap2" }

# CarPlay: pairing, encrypted channels, MFi and its certificates
ed25519-dalek = "=2.2.0"
x25519-dalek = { version = "=2.0.1", features = ["static_secrets"] }
chacha20poly1305 = "=0.10.1"
aes = "=0.8.4"
ctr = "=0.9.2"
hkdf = "=0.12.4"
sha2 = "=0.10.9"
sha1 = "=0.10.7"
der = { version = "=0.7.10", features = ["alloc"] }
p256 = { version = "=0.13.2", features = ["ecdsa", "pkcs8"] }
num-bigint = "=0.4.8"
serde_json = "=1.0.154"
libc = "=0.2.190"
rand_core = { version = "=0.6.4", features = ["getrandom"] }
x509-cert = "0.2"
cms = "0.2"
base64ct = { version = "=1.8.3", features = ["alloc"] }

# CarPlay audio
unsafe-libopus = "=0.2.0"

# Carlink
aes-gcm = "0.10.3"
hmac = "0.12.1"
prost = "0.14"
prost-build = "0.14"
protox = "0.10"
bluer = { version = "0.17.4", default-features = false }
crc32fast = "1.5"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1.54", default-features = false }
mpeg2ts = "=0.6.1"
pbkdf2 = { version = "0.12.2", default-features = false, features = ["hmac"] }
futures-util = { version = "0.3", default-features = false }
zbus = { version = "5.13", default-features = false, features = ["tokio"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
