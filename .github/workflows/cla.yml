name: CLA

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]
  issue_comment:
    types: [created]

permissions:
  contents: write # writes the cla-signatures branch
  pull-requests: write # comments on pull requests
  issues: write # comments API of issue_comment events
  statuses: write # the license/cla status

# Run one at a time so that signatures are never written concurrently
concurrency:
  group: cla-signatures
  cancel-in-progress: false

jobs:
  cla:
    if: github.event_name == 'pull_request_target' || github.event.issue.pull_request
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/scripts
          persist-credentials: false
      - uses: actions/github-script@v9
        with:
          script: |
            const run = require('./.github/scripts/cla.js');
            await run({ github, context, core });
